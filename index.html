<html>
    <head>
        <style>
            .title
            {
               border: 2px solid black;
               position: absolute;
               top: 40%;
               left: 40%;
               overflow: hidden;
               padding: 5px 10px;
               border-radius: 10px;
               color: white;
            }
            .title::before
            {
                content:"";
                background-color: red;
                position: absolute;
                top: 0px;
                width: 105%;
                height: 100%;
                left: -100%;
                transition-duration: 1s;
                transition-property: all;
                z-index: -1;
            }
            .title:hover::before
            {
                left: 0%;
            }
            .title2
            {
                 border: 2px solid black;
               position: absolute;
               top: 36%;
               left: 28%;
               overflow: hidden;
               padding: 3px 10px;
               border-radius: 10px;
               color: white;
               font-size: 35px;
            }
            .title2::before
            {
                  content:"";
                background-color: red;
                position: absolute;
                top: 0px;
                width: 105%;
                height: 100%;
                left: -100%;
                transition-duration: 1s;
                transition-property: all;
                z-index: -1;
            }
            .title2:hover::before
            {
                left: 0%;
            }
            .title3
            {
                  border: 2px solid black;
               position: absolute;
               top: 35%;
               left: 57%;
               overflow: hidden;
               padding: 3px 10px;
               border-radius: 10px;
               color: white;
               font-size: 35px;
            }
            .title3::before
            {
                   content:"";
                background-color: red;
                position: absolute;
                top: 0px;
                width: 105%;
                height: 100%;
                left: -100%;
                transition-duration: 1s;
                transition-property: all;
                z-index: -1;
            }
            .title3:hover::before
            {
                left: 0%;
            }
        </style>
    </head>
    <body>
        <h1 class="title">subscribe</h1>
        <h2 class="title2">like</h2>
        <h3 class="title3">share</h3>
    </body>
</html>
